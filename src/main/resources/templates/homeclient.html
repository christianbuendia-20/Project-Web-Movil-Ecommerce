<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Panel de Cliente')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/cliente-home.css}">
</head>

<body>
<div class="page-shell">
    <div th:replace="~{fragments/navbar-client :: navbar}"></div>

    <main class="client-home">
        <section class="hero-client">
            <div class="hero-content">
                <h1>
                    Bienvenido,
                    <span id="userNameDisplay">Cliente</span>
                    👋
                </h1>

                <h2>
                    Equipos de
                    <span>calidad garantizada</span>
                    para tu proyecto
                </h2>

                <p>Panel HMI, PLC y Módulos Remotos. Entrega rápida y soporte postventa.</p>
            </div>
        </section>

        <section class="recommended-section">
            <h2>Productos recomendados</h2>

            <div class="products-grid">
                <article class="product-card" th:each="producto : ${topProductos}">
                    <div class="product-image">
                        <img th:if="${producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}"
                             th:src="${producto.imagenUrl}"
                             th:alt="${producto.nombre}"
                             style="width:100%;height:100%;object-fit:cover;">
                        <span th:unless="${producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}">&#128187;</span>
                    </div>

                    <div class="product-info">
                        <h3 th:text="${producto.nombre}">Nombre del producto</h3>
                        <p th:text="${producto.nombreCategoria}">Categoria</p>

                        <div class="product-footer">
                            <div>
                                <strong th:text="${'S/' + #numbers.formatDecimal(producto.precio, 1, 0)}">S/0</strong>
                                <small th:text="${'En stock: ' + producto.stock + ' und.'}">En stock</small>
                            </div>

                            <a th:href="@{/catalogclient}" class="add-button">+ Agregar</a>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const userId = localStorage.getItem('userId');
    if (userId) {
        try {
            const res = await fetch('/api/profile?usuarioId=' + userId, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json' }
            });
            if (res.ok) {
                const data = await res.json();
                const nameEl = document.getElementById('userNameDisplay');
                if (nameEl) nameEl.textContent = data.nombres || 'Cliente';
            }
        } catch (e) {}
    }
});
</script>
</body>
</html>
