<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/layout :: head('Pago No Completado')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/payment-result.css}">
</head>

<body>
<div class="result-page">
    <div th:replace="~{fragments/navbar-client :: navbar}"></div>

    <div class="result-container">
        <div class="result-card">
            <div class="result-icon">❌</div>
            <h1>Pago No Completado</h1>
            <p class="subtitle">El pago fue rechazado o cancelado. No se realizó ningún cargo.</p>
            <p class="order-ref" id="orderId"></p>

            <div class="status-note error">
                El stock de los productos ha sido restaurado. Puedes volver al catálogo y realizar un nuevo pedido.
            </div>

            <div class="result-actions">
                <a href="/catalogclient" class="btn-primary">Ir al catálogo</a>
                <a href="/myorders" class="btn-secondary">Mis pedidos</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/payment-result.js}"></script>
</body>

</html>
