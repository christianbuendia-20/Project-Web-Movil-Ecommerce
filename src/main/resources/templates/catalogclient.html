<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/layout :: head('Catalogo')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>


<body>
<div class="catalog-page">
    <div th:replace="~{fragments/navbar-client :: navbar}"></div>

    <main class="catalog-shell">
        <section class="search-wrap">
            <input id="searchInput" type="search" placeholder="🔍 Buscar por nombre, referencia o categoría...">
        </section>

        <section class="catalog-layout">
            <aside class="filters">
                <h2>FILTROS</h2>

                <div class="filter-group" id="categoryFilters">
                    <h3>CATEGORIAS</h3>
                    <button class="filter-option active" data-category="Todos">Todos</button>
                </div>

                <div class="filter-group">
                    <h3>PRECIO</h3>
                    <button class="filter-option" data-price="0-500">S/ 0 - S/ 500</button>
                    <button class="filter-option" data-price="500-1500">S/ 500 - S/ 1,500</button>
                    <button class="filter-option" data-price="1500-3000">S/ 1,500 - S/ 3,000</button>
                    <button class="filter-option" data-price="3000">S/ 3,000 o más</button>
                    <button class="filter-option active" data-price="Todos">Todos</button>
                </div>

                <div class="filter-group">
                    <h3>DISPONIBILIDAD</h3>
                    <button class="filter-option" data-stock="con">Con stock</button>
                    <button class="filter-option" data-stock="sin">Sin stock</button>
                    <button class="filter-option active" data-stock="Todos">Todos</button>
                </div>
            </aside>

            <section class="products-grid" id="productsGrid">
                <p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">Cargando productos...</p>
            </section>
        </section>
    </main>
</div>

<script th:src="@{/js/catalog.js}"></script>
</body>

</html>
